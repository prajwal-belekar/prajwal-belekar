    Hey 👋
  </text>

  <!-- Introduction -->
  <text
    x="495"
    y="112"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
  >
    I'm the kind of person who can start with
  </text>

  <text
    x="495"
    y="136"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
  >
    a simple idea and somehow end up exploring
  </text>

  <text
    x="495"
    y="160"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
