<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="620"
  viewBox="0 0 1200 620"
>

  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="620"
    rx="24"
    fill="#0D1117"
  />

  <!-- ===================================================== -->
  <!-- DEFINITIONS -->
  <!-- ===================================================== -->

  <defs>

    <!-- Full-height left image -->
    <clipPath id="imageClip">
      <path
        d="
          M24 0
          H650
          V620
          H24
          Q0 620 0 596
          V24
          Q0 0 24 0
          Z
        "
      />
    </clipPath>

    <!-- Subtle fade from image into text -->
    <linearGradient
      id="imageFade"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#000000"
        stop-opacity="0"
      />

      <stop
        offset="70%"
        stop-color="#000000"
        stop-opacity="0.05"
      />

      <stop
        offset="100%"
        stop-color="#0D1117"
        stop-opacity="0.75"
      />
    </linearGradient>

    <!-- Right panel -->
    <linearGradient
      id="panelGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#0D1117"
        stop-opacity="0.80"
      />

      <stop
        offset="15%"
        stop-color="#0D1117"
        stop-opacity="0.96"
      />

      <stop
        offset="100%"
        stop-color="#0D1117"
        stop-opacity="1"
      />
    </linearGradient>

  </defs>


  <!-- ===================================================== -->
  <!-- ITACHI IMAGE -->
  <!-- ===================================================== -->

  <g clip-path="url(#imageClip)">

    <image
      x="0"
      y="0"
      width="650"
      height="620"
      preserveAspectRatio="xMidYMid slice"
      href=".\assets\itachi.png"
      xlink:href="./assets/itachi.png"
    />

    <!-- Very subtle image fade -->
    <rect
      x="0"
      y="0"
      width="650"
      height="620"
      fill="url(#imageFade)"
    />

  </g>


  <!-- ===================================================== -->
  <!-- RIGHT TEXT PANEL -->
  <!-- ===================================================== -->

  <rect
    x="625"
    y="0"
    width="575"
    height="620"
    fill="url(#panelGradient)"
  />


  <!-- ===================================================== -->
  <!-- DIVIDER -->
  <!-- ===================================================== -->

  <rect
    x="650"
    y="55"
    width="1"
    height="510"
    fill="#30363D"
    opacity="0.8"
  />


  <!-- ===================================================== -->
  <!-- TEXT -->
  <!-- ===================================================== -->

  <g
    font-family="Arial, Helvetica, sans-serif"
    fill="#F0F6FC"
  >

    <!-- Heading -->

    <text
      x="700"
      y="82"
      font-size="25"
      font-weight="700"
    >
      Hey 👋
    </text>


    <!-- Intro -->

    <text
      x="700"
      y="122"
      font-size="16"
      fill="#E6EDF3"
    >
      I'm the kind of person who can start with a simple idea and
    </text>

    <text
      x="700"
      y="145"
      font-size="16"
      fill="#E6EDF3"
    >
      somehow end up exploring five completely different
    </text>

    <text
      x="700"
      y="168"
      font-size="16"
      fill="#E6EDF3"
    >
      technologies.
    </text>


    <!-- Learning -->

    <text
      x="700"
      y="208"
      font-size="16"
      font-weight="700"
    >
      🌱 Learning by building
    </text>

    <text
      x="700"
      y="231"
      font-size="14"
      fill="#C9D1D9"
    >
      I understand things better when I actually get to work with
    </text>

    <text
      x="700"
      y="252"
      font-size="14"
      fill="#C9D1D9"
    >
      them.
    </text>


    <!-- Rabbit holes -->

    <text
      x="700"
      y="292"
      font-size="16"
      font-weight="700"
    >
      🔍 Going down rabbit holes
    </text>

    <text
      x="700"
      y="315"
      font-size="14"
      fill="#C9D1D9"
    >
      One interesting question can easily turn into hours of
    </text>

    <text
      x="700"
      y="336"
      font-size="14"
      fill="#C9D1D9"
    >
      research.
    </text>


    <!-- Background noise -->

    <text
      x="700"
      y="376"
      font-size="16"
      font-weight="700"
    >
      🎧 Working with a little background noise
    </text>

    <text
      x="700"
      y="399"
      font-size="14"
      fill="#C9D1D9"
    >
      Music, anime, or whatever happens to be playing.
    </text>


    <!-- Figuring things out -->

    <text
      x="700"
      y="439"
      font-size="16"
      font-weight="700"
    >
      🧩 Figuring things out
    </text>

    <text
      x="700"
      y="462"
      font-size="14"
      fill="#C9D1D9"
    >
      Especially when something doesn't work the way I
    </text>

    <text
      x="700"
      y="483"
      font-size="14"
      fill="#C9D1D9"
    >
      expected.
    </text>


    <!-- Bottom note -->

    <line
      x1="700"
      y1="515"
      x2="1140"
      y2="515"
      stroke="#30363D"
      stroke-width="1"
    />

    <text
      x="700"
      y="542"
      font-size="12"
      fill="#8B949E"
    >
      Currently trying to balance curiosity, code, and way too many
    </text>

    <text
      x="700"
      y="560"
      font-size="12"
      fill="#8B949E"
    >
      tabs.
    </text>

  </g>

</svg>