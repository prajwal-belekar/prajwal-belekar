<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="288"
  viewBox="0 0 512 288"
>

  <!-- ================================================= -->
  <!-- BACKGROUND IMAGE -->
  <!-- ================================================= -->

  <image
    href="./assets/itachi.png"
    x="0"
    y="0"
    width="512"
    height="288"
    preserveAspectRatio="none"
  />


  <!-- ================================================= -->
  <!-- DARK TEXT PANEL -->
  <!-- ================================================= -->

  <defs>

    <linearGradient
      id="textFade"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#0D1117"
        stop-opacity="0.15"
      />

      <stop
        offset="35%"
        stop-color="#0D1117"
        stop-opacity="0.80"
      />

      <stop
        offset="100%"
        stop-color="#0D1117"
        stop-opacity="0.97"
      />
    </linearGradient>

  </defs>

  <rect
    x="260"
    y="0"
    width="252"
    height="288"
    fill="url(#textFade)"
  />


  <!-- ================================================= -->
  <!-- VERTICAL DIVIDER -->
  <!-- ================================================= -->

  <rect
    x="265"
    y="22"
    width="1"
    height="244"
    fill="#30363D"
    opacity="0.8"
  />


  <!-- ================================================= -->
  <!-- TEXT -->
  <!-- ================================================= -->

  <g
    font-family="Arial, Helvetica, sans-serif"
    fill="#F0F6FC"
  >

    <!-- HEY -->

    <text
      x="280"
      y="48"
      font-size="12"
      font-weight="700"
    >
      Hey 👋
    </text>


    <!-- INTRO -->

    <text
      x="280"
      y="67"
      font-size="7.2"
      fill="#E6EDF3"
    >
      I'm the kind of person who can start with a simple idea and
    </text>

    <text
      x="280"
      y="78"
      font-size="7.2"
      fill="#E6EDF3"
    >
      somehow end up exploring five completely different
    </text>

    <text
      x="280"
      y="89"
      font-size="7.2"
      fill="#E6EDF3"
    >
      technologies.
    </text>


    <!-- LEARNING -->

    <text
      x="280"
      y="108"
      font-size="8"
      font-weight="700"
    >
      🌱 Learning by building
    </text>

    <text
      x="280"
      y="119"
      font-size="6.8"
      fill="#C9D1D9"
    >
      I understand things better when I actually get to work with
    </text>

    <text
      x="280"
      y="129"
      font-size="6.8"
      fill="#C9D1D9"
    >
      them.
    </text>


    <!-- RABBIT HOLES -->

    <text
      x="280"
      y="148"
      font-size="8"
      font-weight="700"
    >
      🔍 Going down rabbit holes
    </text>

    <text
      x="280"
      y="159"
      font-size="6.8"
      fill="#C9D1D9"
    >
      One interesting question can easily turn into hours of
    </text>

    <text
      x="280"
      y="169"
      font-size="6.8"
      fill="#C9D1D9"
    >
      research.
    </text>


    <!-- BACKGROUND NOISE -->

    <text
      x="280"
      y="188"
      font-size="8"
      font-weight="700"
    >
      🎧 Working with a little background noise
    </text>

    <text
      x="280"
      y="199"
      font-size="6.8"
      fill="#C9D1D9"
    >
      Music, anime, or whatever happens to be
    </text>

    <text
      x="280"
      y="209"
      font-size="6.8"
      fill="#C9D1D9"
    >
      playing.
    </text>


    <!-- FIGURING THINGS OUT -->

    <text
      x="280"
      y="228"
      font-size="8"
      font-weight="700"
    >
      🧩 Figuring things out
    </text>

    <text
      x="280"
      y="239"
      font-size="6.8"
      fill="#C9D1D9"
    >
      Especially when something doesn't work the way I
    </text>

    <text
      x="280"
      y="249"
      font-size="6.8"
      fill="#C9D1D9"
    >
      expected.
    </text>


    <!-- BOTTOM LINE -->

    <line
      x1="280"
      y1="260"
      x2="498"
      y2="260"
      stroke="#30363D"
      stroke-width="0.7"
    />

    <text
      x="280"
      y="270"
      font-size="5.5"
      fill="#8B949E"
    >
      Currently trying to balance curiosity, code, and way too many
    </text>

    <text
      x="280"
      y="279"
      font-size="5.5"
      fill="#8B949E"
    >
      tabs.
    </text>

  </g>

</svg>